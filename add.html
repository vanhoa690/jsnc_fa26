<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <nav class="bg-blue-600 text-white shadow">
      <div
        class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <strong>WEB2064 JSNC</strong>

        <div class="hidden md:flex items-center space-x-8">
          <a href="index.html" class="hover:text-gray-200">Danh sách</a>
          <a href="add.html" class="hover:text-gray-200">Thêm mới</a>
          <a href="register.html" class="hover:text-gray-200">Đăng ký</a>
        </div>
        <div class="hidden md:flex items-center space-x-6"></div>
      </div>
    </nav>
    <div class="max-w-6xl mx-auto mt-10 px-4 text-center">
      <h1 class="text-2xl font-semibold mb-6">Thêm mới</h1>

      <form id="form-add" class="space-y-6">
        <!-- Text input -->
        <div>
          <label for="name" class="block font-medium mb-1"> Name </label>
          <input
            id="name"
            type="text"
            name="name"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="duration" class="block font-medium mb-1">
            Duration
          </label>
          <input
            id="duration"
            type="number"
            name="duration"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="thumbnail" class="block font-medium mb-1">
            Thumbnail
          </label>
          <input
            id="thumbnail"
            type="text"
            name="thumbnail"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="category" class="block font-medium mb-1">
            Category
          </label>

          <select
            id="category"
            name="category"
            class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">-- Chọn danh mục --</option>
            <option value="Frontend">Frontend</option>
            <option value="Backend">Backend</option>
            <option value="Mobile">Mobile</option>
          </select>
        </div>
        <!-- Buttons -->
        <button
          type="submit"
          class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
        >
          Submit
        </button>
      </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    <script src="add.js"></script>
  </body>
</html>
